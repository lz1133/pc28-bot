<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>深1.0 · 实时版</title>
<style>
:root { --bg:#0d1117; --card:#161b22; --fg:#e6edf3; --dim:#8b949e; --blue:#58a6ff; --green:#3fb950; --red:#f85149; --yellow:#d29922; --border:#30363d; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--fg); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; padding:12px; max-width:640px; margin:0 auto; padding-bottom:40px; }
h1 { font-size:19px; color:var(--blue); text-align:center; margin:8px 0 2px; }
.status { text-align:center; color:var(--dim); font-size:12px; margin-bottom:10px; padding:6px 0; border-bottom:1px dashed var(--border); }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:12px; transition: opacity 0.3s; }
h2 { font-size:15px; color:var(--blue); margin-bottom:10px; border-left:3px solid var(--blue); padding-left:6px; }
.row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:15px; }
.row:last-child { border-bottom:none; }
.row .k { color:var(--dim); }
.row .v { font-weight:bold; }
.v.kill { color:var(--red); } .v.hit { color:var(--green); }
.latest { text-align:center; font-size:15px; line-height:1.6; }
.badge { display:inline-block; padding:1px 8px; border-radius:8px; font-size:12px; }
.badge.g { background:rgba(63,185,80,.15); color:var(--green); }
.badge.r { background:rgba(248,81,73,.15); color:var(--red); }
.stats-box { font-family:ui-monospace,Menlo,monospace; font-size:13px; line-height:1.9; color:var(--fg); }
.stats-box .num { color:var(--blue); font-weight:bold; }
.wait-alert { display:none; background:rgba(210,153,34,.15); color:var(--yellow); border:1px solid var(--yellow); text-align:center; padding:10px; border-radius:8px; font-size:13px; margin-bottom:10px; font-weight:bold; }
</style>
</head>
<body>
<h1>🌌 深1.0 · 实时版</h1>
<div class="status" id="status">正在连接云端...</div>

<!-- 实时开奖区 -->
<div class="card latest" id="latest-box">等待官方开奖数据...</div>
<div id="live-info" style="text-align:center; font-size:13px; color:var(--blue); margin-top:-8px; margin-bottom:12px; font-weight:bold;"></div>

<!-- 预测区 -->
<div class="card" id="prediction-card">
  <h2>🎯 下期预测</h2>
  
  <!-- 警告提示 -->
  <div id="wait-alert" class="wait-alert">
    ⚠️ 新一期已开奖，云端正在计算新预测，请勿使用当前数据！
  </div>
  
  <div class="row"><span class="k">预测期号</span><span class="v" id="p-period">--</span></div>
  <div class="row"><span class="k">❌ 杀 (不买)</span><span class="v kill" id="p-kill">--</span></div>
  <div class="row"><span class="k">✅ 双组推荐</span><span class="v hit" id="p-main">--</span></div>
  <div class="row"><span class="k">🛡️ 防守推荐</span><span class="v hit" id="p-def">--</span></div>
  <div class="row"><span class="k">🎯 推荐特码</span><span class="v hit" id="p-tema">--</span></div>
</div>

<!-- 历史验证卡片 -->
<div class="card" id="verify-card" style="display:none; text-align:center; font-size:14px;">
  <h2 style="text-align:left;">📊 上期验证</h2>
  <div id="verify-content" style="margin-top:10px;"></div>
</div>

<!-- 胜率统计卡片 -->
<div class="card stats-box" id="stats-card">
  <h2>📈 本次盲测战绩</h2>
  <div id="stats-content">战绩计算中，请等待云端运行一次...</div>
</div>

<script>
let cloudData = null;
let livePeriod = 0; // 实时开奖期号
let isUpdating = false; // 是否正在更新中

// 1. 获取云端数据 (预测与战绩)
async function loadCloudData(){
  try {
    const res = await fetch('data.json?t=' + Date.now()); 
    cloudData = await res.json();
    document.getElementById('status').textContent = '✅ 已连接云端';
    
    // 渲染预测
    const p = cloudData.prediction;
    if (p) {
      document.getElementById('p-period').textContent = cloudData.next_period + ' 期';
      document.getElementById('p-kill').textContent = p.kill;
      document.getElementById('p-main').textContent = p.main.join(' , ');
      document.getElementById('p-def').textContent = p.defense;
      document.getElementById('p-tema').textContent = p.temas.map(c=>String(c).padStart(2,'0')).join('  ');
    }

    // 渲染上期验证
    const v = cloudData.last_verify;
    if (v && v.actual) {
      document.getElementById('verify-card').style.display = 'block';
      const isHit = v.mainHit || v.defHit;
      const hitHtml = isHit ? '<span style="color:var(--green)">✅ 命中</span>' : '<span style="color:var(--red)">❌ 未中</span>';
      document.getElementById('verify-content').innerHTML = `实际: <b>${v.actual}</b> | 双组/防守: ${hitHtml}`;
    }

    // 渲染战绩
    const s = cloudData.stats;
    if (s && s.total > 0) {
      document.getElementById('stats-content').innerHTML = 
        `总期数: <span class="num">${s.total}</span> | 双组中: <span class="num">${s.main}</span> | 防守中: <span class="num">${s.def}</span> | 特码中: <span class="num">${s.tema}</span><br>` +
        `<span style="color:var(--dim)">----------------------------------------</span><br>` +
        `双组命中率: <b style="color:var(--green)">${(s.main/s.total*100).toFixed(1)}%</b> | ` +
        `防守命中率: <b style="color:var(--green)">${(s.def/s.total*100).toFixed(1)}%</b> | ` +
        `特码命中率: <b style="color:var(--green)">${(s.tema/s.total*100).toFixed(1)}%</b>`;
    }

    checkSyncState(); // 每次拉取云端数据后，检查是否同步
  } catch (e) {
    document.getElementById('status').textContent = '⚠️ 云端数据未生成，稍后自动重试...';
  }
}

// 2. 实时抓取官网开奖和倒计时 (每3秒)
async function fetchLiveData(){
  try {
    const res = await fetch('https://pc28.help/api/kj.json?nbr=1&_=' + Date.now());
    const data = await res.json();
    if(data.message === 'success' && data.data.length > 0){
      const latest = data.data[0];
      livePeriod = Number(latest.nbr);
      const nums = latest.number.split('+').map(Number);
      const sum = nums.reduce((a,b)=>a+b,0);
      const type = (sum>=14?'大':'小')+(sum%2?'单':'双');
      const badgeClass = type[0]==='大' ? 'r' : 'g';
      const cd = Array.isArray(data.countdown) ? data.countdown[0] : data.countdown;
      
      // 渲染实时开奖
      document.getElementById('latest-box').innerHTML = 
        `🎲 最新开奖: <b>${latest.nbr}</b> 期<br><span style="font-size:18px; color:var(--blue)">${latest.number} = ${sum}</span> <span class="badge ${badgeClass}">[${type}]</span>`;
      
      // 渲染倒计时
      document.getElementById('live-info').innerHTML = `⚡ 距下期开奖: <span style="color:var(--red); font-size:15px;">${cd}</span> 秒`;

      checkSyncState(); // 每次更新实时开奖后，检查同步状态
    }
  } catch(e) {}
}

// 3. 检查数据是否同步 (核心防错逻辑)
function checkSyncState(){
  if(!cloudData || !cloudData.next_period || !livePeriod) return;
  
  const predPeriod = Number(cloudData.next_period); // 云端预测的期号
  
  // 如果实时开奖的期号 >= 云端要预测的期号，说明云端还没算出新的预测
  if (livePeriod >= predPeriod) {
    if (!isUpdating) {
      isUpdating = true;
      document.getElementById('wait-alert').style.display = 'block';
      document.getElementById('prediction-card').style.opacity = '0.4'; // 变暗
    }
  } else {
    if (isUpdating) {
      isUpdating = false;
      document.getElementById('wait-alert').style.display = 'none';
      document.getElementById('prediction-card').style.opacity = '1';
    }
  }
}

// 启动
loadCloudData();
fetchLiveData();

// 设置循环：实时开奖每3秒抓一次，云端预测每30秒同步一次
setInterval(fetchLiveData, 3000); 
setInterval(loadCloudData, 30000); 
</script>
</body>
</html>
