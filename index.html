<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>小央 公益7.0 · 云端版</title>
<style>
:root { --bg:#0d1117; --card:#161b22; --fg:#e6edf3; --dim:#8b949e; --blue:#58a6ff; --green:#3fb950; --red:#f85149; --border:#30363d; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:var(--bg); color:var(--fg); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; padding:12px; max-width:640px; margin:0 auto; padding-bottom:40px; }
h1 { font-size:19px; color:var(--blue); text-align:center; margin:8px 0 2px; }
.status { text-align:center; color:var(--dim); font-size:12px; margin-bottom:10px; padding:6px 0; border-bottom:1px dashed var(--border); }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:12px; }
h2 { font-size:15px; color:var(--blue); margin-bottom:10px; border-left:3px solid var(--blue); padding-left:6px; }
.row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:15px; }
.row:last-child { border-bottom:none; }
.row .k { color:var(--dim); }
.row .v { font-weight:bold; }
.v.kill { color:var(--red); } .v.hit { color:var(--green); }
.latest { text-align:center; font-size:14px; line-height:1.6; }
.badge { display:inline-block; padding:1px 8px; border-radius:8px; font-size:12px; }
.badge.g { background:rgba(63,185,80,.15); color:var(--green); }
</style>
</head>
<body>
<h1>🌌 7.0 举世闻名 · 云端版</h1>
<div class="status" id="status">正在加载云端数据…</div>

<div class="card latest" id="latest">等待数据…</div>

<div class="card">
  <h2>🎯 下期预测</h2>
  <div class="row"><span class="k">预测期号</span><span class="v" id="p-period">--</span></div>
  <div class="row"><span class="k">❌ 杀 (不买)</span><span class="v kill" id="p-kill">--</span></div>
  <div class="row"><span class="k">✅ 双组推荐</span><span class="v hit" id="p-main">--</span></div>
  <div class="row"><span class="k">🛡️ 防守推荐</span><span class="v hit" id="p-def">--</span></div>
  <div class="row"><span class="k">🎯 推荐特码</span><span class="v hit" id="p-tema">--</span></div>
</div>

<div class="card" style="text-align:center; padding:10px;">
  <button onclick="loadData()" style="padding:8px 20px; border-radius:8px; border:1px solid var(--border); background:#21262d; color:var(--fg); font-size:14px;">🔄 刷新数据</button>
</div>

<script>
async function loadData(){
  const statusEl = document.getElementById('status');
  statusEl.textContent = '正在拉取最新预测…';
  try {
    // 加个时间戳防止浏览器缓存
    const res = await fetch('data.json?t=' + Date.now()); 
    const data = await res.json();
    
    // 渲染最新开奖
    const l = data.latest;
    document.getElementById('latest').innerHTML = 
      `🎲 最新开奖: <b>${l.period}</b> 期 &nbsp; ${l.nums.join(' + ')} = <b>${l.sum}</b> &nbsp; <span class="badge g">[${l.type}]</span>`;
    
    // 渲染预测
    const p = data.prediction;
    if (p) {
      document.getElementById('p-period').textContent = data.next_period + ' 期';
      document.getElementById('p-kill').textContent = p.kill;
      document.getElementById('p-main').textContent = p.main.join(' , ');
      document.getElementById('p-def').textContent = p.defense;
      document.getElementById('p-tema').textContent = p.temas.map(c=>String(c).padStart(2,'0')).join('  ');
      statusEl.textContent = '✅ 已获取云端最新数据';
    }
  } catch (e) {
    statusEl.textContent = '⚠️ 云端数据还没生成，请稍等或点击刷新';
  }
}
loadData();
</script>
</body>
</html>
